/* =========================================================
   Portfolio — Alvarez Paredes Dario Ezequiel
   Sistema de diseño inspirado en Assemblr World
   (paleta violeta/azul/celeste, &quot;globos&quot; orgánicos animados,
   navbar tipo píldora con vidrio, tipografía Poppins)
   ========================================================= */

:root {
  --purple-900: #1c1240;
  --purple-800: #241a5c;
  --purple-700: #3a2896;
  --purple-600: #4f34d9;
  --blue-500: #5b7bf6;
  --cyan-400: #3fd6e0;
  --cyan-200: #9df1f4;
  --cyan-100: #d6faf9;
  --bg-pale: #f4f2ff;
  --ink: #1c1440;
  --ink-soft: #4b4178;
  --white: #ffffff;
  --ease-fluid: cubic-bezier(0.16, 1, 0.3, 1);
}

/* all content */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 110px;
}

body {
  font-family: &quot;IBM Plex Sans&quot;, sans-serif;
  color: var(--ink);
  background: var(--bg-pale);
  overflow-x: hidden;
}

h1, h2, h3, h4, h5 {
  font-family: &quot;Poppins&quot;, sans-serif;
}

/* section base */
section {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* =========================================================
   GLOBOS (elemento distintivo, tomado de Assemblr World)
   ========================================================= */
.blob {
  position: absolute;
  border-radius: 42% 58% 65% 35% / 45% 45% 55% 55%;
  opacity: 0.55;
  z-index: 0;
  animation: morph 14s ease-in-out infinite, float 10s ease-in-out infinite;
  pointer-events: none;
}
@keyframes morph {
  0%, 100% { border-radius: 42% 58% 65% 35% / 45% 45% 55% 55%; }
  50% { border-radius: 58% 42% 35% 65% / 55% 65% 35% 45%; }
}
@keyframes float {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  50% { transform: translate(10px, -22px) rotate(8deg); }
}
.blob-purple { background: linear-gradient(135deg, var(--purple-600), var(--blue-500)); }
.blob-cyan { background: linear-gradient(135deg, var(--cyan-400), var(--cyan-200)); }

/* ---- selector de idioma ---- */
.lang-switch {
  position: fixed;
  top: 18px;
  right: 16px;
  z-index: 1001;
  display: flex;
  gap: 2px;
  padding: 4px;
  border-radius: 100px;
  background: linear-gradient(120deg, var(--purple-700), var(--purple-900));
  border: 1px solid rgba(255, 255, 255, 0.14);
  box-shadow: 0 8px 24px rgba(28, 18, 64, 0.3);
  transition: background 0.5s var(--ease-fluid);
}
.lang-switch.scrolled {
  background: rgba(255, 255, 255, 0.94);
  border-color: rgba(28, 18, 64, 0.08);
}
.lang-btn {
  border: none;
  background: transparent;
  color: rgba(255, 255, 255, 0.75);
  font-family: &quot;Poppins&quot;, sans-serif;
  font-weight: 700;
  font-size: 0.68rem;
  letter-spacing: 0.04em;
  padding: 6px 12px;
  border-radius: 100px;
  cursor: pointer;
  transition: all 0.4s var(--ease-fluid);
}
.lang-btn.active {
  background: linear-gradient(90deg, var(--purple-600), var(--blue-500));
  color: #fff;
}
.lang-switch.scrolled .lang-btn {
  color: var(--purple-700);
}
.lang-switch.scrolled .lang-btn.active {
  color: #fff;
}

@media (max-width: 767px) {
  .lang-switch {
    top: 10px;
    right: 10px;
    padding: 3px;
  }
  .lang-btn {
    font-size: 0.6rem;
    padding: 5px 9px;
  }
}

/* =========================================================
   NAVBAR — píldora flotante, color unificado con el hero
   ========================================================= */
.navbar {
  position: fixed;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: 720px;
  z-index: 1000;
  padding: 10px 26px;
  border-radius: 100px;
  overflow: visible;
  background: linear-gradient(120deg, var(--purple-700), var(--purple-900));
  border: 1px solid rgba(255, 255, 255, 0.14);
  box-shadow: 0 8px 30px rgba(28, 18, 64, 0.35);
  transition: background 0.5s var(--ease-fluid), box-shadow 0.5s var(--ease-fluid);
}
.navbar.scrolled {
  background: rgba(255, 255, 255, 0.94);
  border-color: rgba(28, 18, 64, 0.08);
  box-shadow: 0 8px 24px rgba(28, 18, 64, 0.15);
}
.navbar .container-fluid {
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.navbar-nav {
  gap: 24px;
}
.nav-link {
  position: relative;
  font-family: &quot;Poppins&quot;, sans-serif;
  font-weight: 600;
  font-size: 0.78rem;
  letter-spacing: 0.04em;
  color: var(--white) !important;
  padding: 6px 2px !important;
  transition: color 0.4s var(--ease-fluid);
}
.navbar.scrolled .nav-link {
  color: var(--purple-700) !important;
}
.nav-link::after {
  content: &quot;&quot;;
  position: absolute;
  left: 0;
  bottom: -4px;
  height: 2px;
  width: 0;
  background: linear-gradient(90deg, var(--purple-600), var(--cyan-400));
  transition: width 0.45s var(--ease-fluid);
}
.nav-link.active::after,
.nav-link:hover::after {
  width: 100%;
}

/* ---- toggler: 3 barras que se transforman en una X ---- */
.navbar-toggler {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  width: 30px;
  height: 30px;
  border: none;
  background: transparent;
  padding: 0;
  box-shadow: none !important;
}
.toggler-bar {
  display: block;
  width: 20px;
  height: 2px;
  border-radius: 2px;
  background: var(--white);
  transition: transform 0.4s var(--ease-fluid), opacity 0.25s ease, background 0.4s var(--ease-fluid);
}
.navbar.scrolled .toggler-bar {
  background: var(--purple-700);
}
.navbar-toggler.is-open .toggler-bar:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}
.navbar-toggler.is-open .toggler-bar:nth-child(2) {
  opacity: 0;
}
.navbar-toggler.is-open .toggler-bar:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}

@media (max-width: 767px) {
  .navbar {
    top: 10px;
    padding: 8px 18px;
    border-radius: 26px;
  }
  /* el panel se despliega como una tarjeta compacta debajo de la píldora,
     no como una pantalla completa */
  .navbar-collapse {
    position: absolute;
    top: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    min-width: 200px;
    max-width: calc(100vw - 48px);
    background: linear-gradient(160deg, var(--purple-700), var(--purple-900));
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 20px;
    box-shadow: 0 16px 40px rgba(28, 18, 64, 0.4);
    padding: 6px 10px;
  }
  .navbar-nav {
    width: 100%;
    gap: 0;
  }
  .nav-item {
    width: 100%;
    text-align: center;
  }
  .nav-item .nav-link {
    display: block;
    padding: 9px 0 !important;
    font-size: 0.7rem;
  }
}


/* =========================================================
   HERO + SOBRE MI — fondo unificado (sin quiebre visual)
   ========================================================= */
.intro-wrap {
  position: relative;
  overflow: hidden;
  background: radial-gradient(circle at 50% 0%, var(--purple-700) 0%, var(--purple-900) 60%, var(--purple-900) 100%);
}

header.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--white);
  padding: 140px 20px 80px;
}

.hero-eyebrow {
  display: inline-block;
  padding: 6px 18px;
  border-radius: 100px;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.25);
  font-family: &quot;Poppins&quot;, sans-serif;
  font-size: 0.75rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 26px;
  position: relative;
  z-index: 2;
}

.image-perfil {
  position: relative;
  z-index: 2;
  margin: 10px 0 26px;
}
.image-perfil-ring {
  padding: 6px;
  border-radius: 50%;
  display: inline-block;
  background: conic-gradient(from 180deg, var(--cyan-400), var(--purple-600), var(--blue-500), var(--cyan-400));
  animation: glow-pulse 4s var(--ease-fluid) infinite;
}
@keyframes glow-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(63, 214, 224, 0.35); }
  50% { box-shadow: 0 0 0 14px rgba(63, 214, 224, 0); }
}
.image-perfil img {
  width: 170px;
  height: 170px;
  border-radius: 50%;
  object-fit: cover;
  border: 5px solid var(--purple-900);
  display: block;
}

.datos-principales {
  min-height: 100px;
  text-align: center;
  position: relative;
  z-index: 2;
}
.datos-principales h1 {
  font-size: clamp(1.6rem, 4vw, 2.7rem);
  font-weight: 800;
  letter-spacing: -0.01em;
  background: linear-gradient(90deg, var(--white) 20%, var(--cyan-200) 60%, var(--white) 90%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 12px;
}
.datos-principales h2 {
  font-family: &quot;IBM Plex Sans&quot;, sans-serif;
  font-weight: 400;
  font-style: italic;
  color: var(--cyan-100);
  font-size: 1.1rem;
}

/* sobre mi: comparte el fondo de .intro-wrap, sin color ni recorte propio */
.intro-wrap .sobre-mi {
  background: transparent;
  overflow: visible;
  height: auto;
  padding: 40px 20px 130px;
}
.seccion-texto {
  max-width: 760px;
  color: var(--cyan-100);
  padding: 20px;
  font-size: 1.15rem;
  text-align: center;
  font-style: italic;
  font-family: &quot;IBM Plex Sans&quot;, sans-serif;
  line-height: 1.7;
  position: relative;
  z-index: 2;
}

/* =========================================================
   Encabezados de sección + estados globales
   ========================================================= */
.seccion-oscura {
  color: var(--cyan-100);
  background-color: var(--purple-900);
}
.seccion-clara {
  color: var(--ink);
  background-color: var(--white);
}
.seccion-titulo {
  font-size: 2rem;
  font-weight: 800;
  text-align: center;
  padding: 15px 0 30px;
  font-family: &quot;Poppins&quot;, sans-serif;
  position: relative;
  z-index: 2;
}
.seccion-titulo::after {
  content: &quot;&quot;;
  display: block;
  width: 60px;
  height: 4px;
  margin: 14px auto 0;
  border-radius: 10px;
  background: linear-gradient(90deg, var(--purple-600), var(--cyan-400));
}
.texto-negro { color: black; }
.texto-blanco { color: white; }

/* divisores tipo &quot;blob&quot; entre secciones (transición fluida) */
.section-divider {
  position: relative;
  width: 100%;
  height: 90px;
  margin-top: -1px;
  z-index: 1;
  line-height: 0;
}
.section-divider svg {
  width: 100%;
  height: 100%;
  display: block;
}
.divider-into-light path { fill: var(--white); }
.divider-into-dark path { fill: var(--purple-900); }
.divider-into-pale path { fill: var(--bg-pale); }
.from-dark { background: var(--purple-900); }
.from-light { background: var(--white); }
.from-pale { background: var(--bg-pale); }

/* revelado progresivo al hacer scroll */
[data-reveal] {
  opacity: 0;
  transform: translateY(32px) scale(0.98);
  transition: opacity 0.8s var(--ease-fluid), transform 0.8s var(--ease-fluid);
  transition-delay: var(--reveal-delay, 0s);
}
[data-reveal].in-view {
  opacity: 1;
  transform: translateY(0) scale(1);
}

/* =========================================================
   CURSOS
   ========================================================= */
.cursos {
  padding: 90px 20px;
}
.cursos .carousel {
  max-width: 800px;
  width: 100%;
  z-index: 2;
}
.carousel-item {
  height: 700px;
  border-radius: 20px;
  overflow: hidden;
  background: var(--bg-pale);
}
.carousel-item.active,
.carousel-item-next,
.carousel-item-prev {
  display: flex;
  align-items: center;
  justify-content: center;
}
.carousel-item img {
  max-height: 100%;
  width: 100%;
  object-fit: contain;
}
.carousel-inner, .carousel {
  border-radius: 20px;
}
.carousel-caption h5 {
  background: rgba(28, 18, 64, 0.55);
  backdrop-filter: blur(6px);
  display: inline-block;
  padding: 4px 16px;
  border-radius: 100px;
  font-family: &quot;Poppins&quot;, sans-serif;
}
.carousel-indicators [data-bs-target] {
  background-color: var(--purple-600);
}

/* =========================================================
   PROYECTOS
   ========================================================= */
.proyectos {
  padding: 100px 20px 60px;
}
.proyectos img {
  height: 100%;
  width: 100%;
  padding: 0;
  border-radius: 18px;
  display: block;
  transition: transform 0.6s var(--ease-fluid);
}
.proyectos-contenedor {
  padding-top: 10px;
  margin-bottom: 40px;
  position: relative;
  z-index: 2;
}
.proyect {
  position: relative;
  height: 220px;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
  margin-bottom: 20px;
}
.overlay {
  transition: opacity 0.5s var(--ease-fluid);
  opacity: 0;
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 14px;
  background: linear-gradient(135deg, rgba(79, 52, 217, 0.92), rgba(63, 214, 224, 0.85));
  border-radius: 18px;
}
.overlay p {
  font-size: 1.05rem;
  font-weight: 700;
  color: #fff;
  margin-bottom: 0;
}
.proyect:hover img { transform: scale(1.08); }
.proyect:hover .overlay { opacity: 1; }

.proyectos ul {
  max-width: 900px;
  margin-top: 20px;
  padding: 0 10px 60px;
  list-style: none;
  position: relative;
  z-index: 2;
}
.proyectos ul li {
  position: relative;
  padding: 10px 0 10px 24px;
  color: var(--cyan-100);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.proyectos ul li::before {
  content: &quot;\203A&quot;;
  position: absolute;
  left: 0;
  color: var(--cyan-400);
  font-weight: 700;
}
.proyectos ul a {
  color: var(--cyan-200);
  font-weight: 600;
}

/* =========================================================
   EXPERIENCIAS — globos de tamaño uniforme
   ========================================================= */
.experiencias {
  color: var(--ink);
  padding: 90px 20px;
  background-color: var(--bg-pale);
}
.exp-row {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.rangoexp {
  margin-top: 24px;
  font-weight: 700;
  color: #fff;
  font-size: 0.9rem;
  width: 230px;
  text-align: center;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 8px 14px;
  border-radius: 100px;
  background: linear-gradient(90deg, var(--purple-600), var(--blue-500));
  transition: transform 0.4s var(--ease-fluid);
}
.exp-row:hover .rangoexp {
  transform: translateY(-3px) scale(1.03);
}
.experiencias span {
  color: var(--ink-soft);
  font-size: 1.05rem;
  margin-top: 6px;
  text-align: center;
}

/* =========================================================
   CONTACT
   ========================================================= */
.contact {
  padding: 100px 20px;
}
.contact .container {
  max-width: 1200px;
  min-height: 200px;
  padding: 20px;
  position: relative;
  z-index: 2;
}
.contact .rectangulo {
  background: linear-gradient(135deg, var(--purple-700), var(--purple-900));
  border-radius: 26px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
}
.contact .row {
  width: 100%;
  display: flex;
  align-items: center;
}
.contact .descripcion {
  color: var(--cyan-100);
  font-size: 1.2rem;
  padding: 30px;
  font-family: &quot;IBM Plex Sans&quot;, sans-serif;
  font-style: italic;
}
.contact button {
  color: white;
  font-weight: bold;
  background-color: transparent;
  border: 2px solid rgba(255, 255, 255, 0.5);
  padding: 1.25em 2em;
  margin: 10px;
  border-radius: 100px;
  transition: all 0.45s var(--ease-fluid);
}
.contact button i {
  color: white;
  font-size: 1.3rem;
  transition: all 0.45s var(--ease-fluid);
}
.contact button:hover {
  background: linear-gradient(90deg, var(--cyan-400), var(--blue-500));
  border-color: transparent;
  color: #0d0830;
  transform: translateY(-3px);
  box-shadow: 0 10px 24px rgba(63, 214, 224, 0.4);
}
.contact button:hover i {
  color: #0d0830;
}

/* =========================================================
   BUTTON-UP
   ========================================================= */
#button-up {
  width: 56px;
  height: 56px;
  background: linear-gradient(135deg, var(--purple-600), var(--blue-500));
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  border-radius: 50%;
  font-size: 20px;
  position: fixed;
  bottom: 40px;
  right: 40px;
  cursor: pointer;
  box-shadow: 0 10px 26px rgba(79, 52, 217, 0.4);
  border: 4px solid transparent;
  transition: all 0.5s var(--ease-fluid);
  transform: scale(0);
  z-index: 900;
}
#button-up:hover {
  transform: scale(1.1);
  border-color: rgba(0, 0, 0, 0.1);
}

/* =========================================================
   FOOTER
   ========================================================= */
footer {
  min-height: 300px;
  background-color: var(--purple-900);
  padding: 60px 20px 30px;
}
.footer-text {
  color: white;
  font-size: 1.4rem;
  padding: 20px;
  margin-bottom: 20px;
  font-family: &quot;Poppins&quot;, sans-serif;
  font-style: italic;
}
.icons-redes a {
  width: 46px;
  height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2px;
  margin: 10px;
  border: 2px solid white;
  border-radius: 50%;
  transition: all 0.45s var(--ease-fluid);
}
.icons-redes i {
  color: white;
  font-size: 1.3rem;
  transition: all 0.45s var(--ease-fluid);
}
.icons-redes a:hover {
  background: linear-gradient(135deg, var(--cyan-400), var(--purple-600));
  border-color: transparent;
  transform: translateY(-4px);
}
.icons-redes a:hover i {
  color: black;
}
.derechos-autor {
  font-size: 15px;
  color: #a99fd6;
  padding: 20px;
  margin-top: 20px;
}

  .cursos .carousel .carousel-item {

  .proyectos {
    padding: 90px 20px 40px;

}
@media screen and (max-width: 767px) {
  header.hero {
    padding: 90px 20px 50px;
    min-height: auto;
  }
  .hero-eyebrow {
    margin-bottom: 16px;
  }
  .image-perfil {
    margin: 6px 0 18px;
  }
  .image-perfil img {
    width: 130px;
    height: 130px;
  }
}
@media screen and (max-width: 480px) {
  header.hero {

  .intro-wrap .sobre-mi {
    padding-top: 60px;

}

    <script>
// =========================================================
// scroll-up (comportamiento original)
// =========================================================
document.getElementById(&quot;button-up&quot;).addEventListener(&quot;click&quot;, scrollUp);

function scrollUp() {
  var CurrentScroll =
    document.documentElement.scrollTop || document.body.scrollTop;
  if (CurrentScroll > 0) {
    window.scrollTo(0, 0);
  }
}
buttonUp = document.getElementById(&quot;button-up&quot;);

window.onscroll = function () {
  var scroll = document.documentElement.scrollTop;

  if (scroll > 1800) {
    buttonUp.style.transform = &quot;scale(1)&quot;;
  } else if (scroll < 1800) {
    buttonUp.style.transform = &quot;scale(0)&quot;;
  }
};

// =========================================================
// title page (usa el idioma activo)
// =========================================================
const htmlEl = document.documentElement;
let previousTitle = document.title;

window.addEventListener(&quot;blur&quot;, () => {
  previousTitle = document.title;
  document.title = htmlEl.dataset[&quot;blur&quot; + capitalize(htmlEl.lang)];
});

window.addEventListener(&quot;focus&quot;, () => {
  document.title = previousTitle;
});

function capitalize(str) {
  return str.charAt(0).toUpperCase() + str.slice(1);
}

// =========================================================
// footer message effect (re-ejecutable al cambiar de idioma)
// =========================================================
const thanksEl = document.getElementById(&quot;thanks&quot;);
let typewriterTimeoutId = null;

function startTypewriter(str) {
  clearTimeout(typewriterTimeoutId);
  thanksEl.innerHTML = &quot;&quot;;
  let i = 0;
  const speed = 60;

  function typeWriter() {
    if (i < str.length) {
      thanksEl.innerHTML += str.charAt(i);
      i++;
      typewriterTimeoutId = setTimeout(typeWriter, speed);
    }
  }
  typewriterTimeoutId = setTimeout(typeWriter, speed);
}

// =========================================================
// NAVBAR: efecto vidrio al hacer scroll
// =========================================================
const mainNav = document.getElementById(&quot;mainNav&quot;);
const langSwitch = document.getElementById(&quot;langSwitch&quot;);

function toggleNavGlass() {
  const isScrolled = window.scrollY > 80;
  mainNav.classList.toggle(&quot;scrolled&quot;, isScrolled);
  if (langSwitch) langSwitch.classList.toggle(&quot;scrolled&quot;, isScrolled);
}
toggleNavGlass();
window.addEventListener(&quot;scroll&quot;, toggleNavGlass);

// =========================================================
// NAVBAR: resaltar el link de la sección activa
// =========================================================
const navLinks = document.querySelectorAll(&quot;.nav-link&quot;);
const spySections = document.querySelectorAll(&quot;main section[id], #about-me&quot;);

const navSpy = new IntersectionObserver(
  (entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        const id = entry.target.getAttribute(&quot;id&quot;);
        navLinks.forEach((link) => link.classList.remove(&quot;active&quot;));
        const activeLink = document.querySelector(
          '.nav-link[href=&quot;#' + id + '&quot;]'
        );
        if (activeLink) activeLink.classList.add(&quot;active&quot;);
      }
    });
  },
  { rootMargin: &quot;-40% 0px -55% 0px&quot; }
);
spySections.forEach((section) => navSpy.observe(section));

// cerrar el menú colapsable (mobile) al elegir una sección
const navbarCollapseEl = document.getElementById(&quot;navbar-toggler&quot;);
const navbarTogglerBtn = document.querySelector(&quot;.navbar-toggler&quot;);

if (navbarCollapseEl && window.bootstrap) {
  const bsCollapse = window.bootstrap.Collapse.getOrCreateInstance(
    navbarCollapseEl,
    { toggle: false }
  );
  navLinks.forEach((link) => {
    link.addEventListener(&quot;click&quot;, () => {
      if (navbarCollapseEl.classList.contains(&quot;show&quot;)) {
        bsCollapse.hide();
      }
    });
  });

  // icono hamburguesa -> X, con transición suave
  navbarCollapseEl.addEventListener(&quot;show.bs.collapse&quot;, () => {
    navbarTogglerBtn.classList.add(&quot;is-open&quot;);
  });
  navbarCollapseEl.addEventListener(&quot;hide.bs.collapse&quot;, () => {
    navbarTogglerBtn.classList.remove(&quot;is-open&quot;);
  });
}

// =========================================================
// Revelado progresivo al hacer scroll (data-reveal)
// =========================================================
const revealEls = document.querySelectorAll(&quot;[data-reveal]&quot;);

const revealObserver = new IntersectionObserver(
  (entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add(&quot;in-view&quot;);
        revealObserver.unobserve(entry.target);
      }
    });
  },
  { threshold: 0.15 }
);

revealEls.forEach((el) => revealObserver.observe(el));

// =========================================================
// SELECTOR DE IDIOMA (ES / EN)
// =========================================================
const textNodes = document.querySelectorAll(&quot;[data-i18n]&quot;);
const htmlNodes = document.querySelectorAll(&quot;[data-i18n-html]&quot;);
const langButtons = document.querySelectorAll(&quot;.lang-btn&quot;);

function applyLanguage(lang) {
  htmlEl.lang = lang;

  textNodes.forEach((el) => {
    if (el.dataset[lang] !== undefined) el.textContent = el.dataset[lang];
  });

  htmlNodes.forEach((el) => {
    const key = lang + &quot;Html&quot;;
    if (el.dataset[key] !== undefined) el.innerHTML = el.dataset[key];
  });

  document.title = htmlEl.dataset[&quot;title&quot; + capitalize(lang)];
  previousTitle = document.title;

  startTypewriter(thanksEl.dataset[lang]);

  langButtons.forEach((btn) => {
    btn.classList.toggle(&quot;active&quot;, btn.dataset.lang === lang);
  });

  try {
    localStorage.setItem(&quot;siteLang&quot;, lang);
  } catch (e) {
    /* localStorage no disponible: el idioma simplemente no persiste */
  }
}

langButtons.forEach((btn) => {
  btn.addEventListener(&quot;click&quot;, () => {
    if (!btn.classList.contains(&quot;active&quot;)) applyLanguage(btn.dataset.lang);
  });
});

let savedLang = &quot;es&quot;;
try {
  savedLang = localStorage.getItem(&quot;siteLang&quot;) || &quot;es&quot;;
} catch (e) {
  savedLang = &quot;es&quot;;
}
applyLanguage(savedLang);

</script>

/* =========================================================
   Portfolio — Alvarez Paredes Dario Ezequiel

:root {

/* =========================================================

   ========================================================= */
.blob {
  position: absolute;
  border-radius: 42% 58% 65% 35% / 45% 45% 55% 55%;
  opacity: 0.55;
  z-index: 0;
  animation: morph 14s ease-in-out infinite, float 10s ease-in-out infinite;
  pointer-events: none;
}
@keyframes morph {
  0%, 100% { border-radius: 42% 58% 65% 35% / 45% 45% 55% 55%; }
  50% { border-radius: 58% 42% 35% 65% / 55% 65% 35% 45%; }
}
@keyframes float {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  50% { transform: translate(10px, -22px) rotate(8deg); }
}
.blob-purple { background: linear-gradient(135deg, var(--purple-600), var(--blue-500)); }
.blob-cyan { background: linear-gradient(135deg, var(--cyan-400), var(--cyan-200)); }

    width: 100%;
    text-align: center;
  }
  .nav-item .nav-link {
    display: block;
    padding: 9px 0 !important;
    font-size: 0.7rem;
  }
}


/* =========================================================
   HERO + SOBRE MI — fondo unificado (sin quiebre visual)
   ========================================================= */
.intro-wrap {
  position: relative;
  overflow: hidden;
  background: radial-gradient(circle at 50% 0%, var(--purple-700) 0%, var(--purple-900) 60%, var(--purple-900) 100%);
}

header.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--white);
  padding: 140px 20px 80px;
}

.hero-eyebrow {
  display: inline-block;
  padding: 6px 18px;
  border-radius: 100px;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.25);
  font-family: &quot;Poppins&quot;, sans-serif;
  font-size: 0.75rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 26px;
  position: relative;
  z-index: 2;
}

.image-perfil {
  position: relative;
  z-index: 2;
  margin: 10px 0 26px;
}
.image-perfil-ring {
  padding: 6px;
  border-radius: 50%;
  display: inline-block;
  background: conic-gradient(from 180deg, var(--cyan-400), var(--purple-600), var(--blue-500), var(--cyan-400));
  animation: glow-pulse 4s var(--ease-fluid) infinite;
}
@keyframes glow-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(63, 214, 224, 0.35); }
  50% { box-shadow: 0 0 0 14px rgba(63, 214, 224, 0); }
}
.image-perfil img {
  width: 170px;
  height: 170px;
  border-radius: 50%;
  object-fit: cover;
  border: 5px solid var(--purple-900);
  display: block;
}

.datos-principales {
  min-height: 100px;
  text-align: center;
  position: relative;
  z-index: 2;
}
.datos-principales h1 {
  font-size: clamp(1.6rem, 4vw, 2.7rem);
  font-weight: 800;
  letter-spacing: -0.01em;
  background: linear-gradient(90deg, var(--white) 20%, var(--cyan-200) 60%, var(--white) 90%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 12px;
}
.datos-principales h2 {
  font-family: &quot;IBM Plex Sans&quot;, sans-serif;
  font-weight: 400;
  font-style: italic;
  color: var(--cyan-100);
  font-size: 1.1rem;
}

/* sobre mi: comparte el fondo de .intro-wrap, sin color ni recorte propio */
.intro-wrap .sobre-mi {
  background: transparent;
  overflow: visible;
  height: auto;
  padding: 40px 20px 130px;
}
.seccion-texto {
  max-width: 760px;
  color: var(--cyan-100);
  padding: 20px;
  font-size: 1.15rem;
  text-align: center;
  font-style: italic;
  font-family: &quot;IBM Plex Sans&quot;, sans-serif;
  line-height: 1.7;
  position: relative;
  z-index: 2;
}

/* =========================================================
   Encabezados de sección + estados globales
   ========================================================= */
.seccion-oscura {
  color: var(--cyan-100);
  background-color: var(--purple-900);
}
.seccion-clara {
  color: var(--ink);
  background-color: var(--white);
}
.seccion-titulo {
  font-size: 2rem;
  font-weight: 800;
  text-align: center;
  padding: 15px 0 30px;
  font-family: &quot;Poppins&quot;, sans-serif;
  position: relative;
  z-index: 2;
}
.seccion-titulo::after {
  content: &quot;&quot;;
  display: block;
  width: 60px;
  height: 4px;
  margin: 14px auto 0;
  border-radius: 10px;
  background: linear-gradient(90deg, var(--purple-600), var(--cyan-400));
}
.texto-negro { color: black; }
.texto-blanco { color: white; }

/* divisores tipo &quot;blob&quot; entre secciones (transición fluida) */
.section-divider {
  position: relative;
  width: 100%;
  height: 90px;
  margin-top: -1px;
  z-index: 1;
  line-height: 0;
}
.section-divider svg {
  width: 100%;
  height: 100%;
  display: block;
}
.divider-into-light path { fill: var(--white); }
.divider-into-dark path { fill: var(--purple-900); }
.divider-into-pale path { fill: var(--bg-pale); }
.from-dark { background: var(--purple-900); }
.from-light { background: var(--white); }
.from-pale { background: var(--bg-pale); }

/* revelado progresivo al hacer scroll */
[data-reveal] {
  opacity: 0;
  transform: translateY(32px) scale(0.98);
  transition: opacity 0.8s var(--ease-fluid), transform 0.8s var(--ease-fluid);
  transition-delay: var(--reveal-delay, 0s);
}
[data-reveal].in-view {
  opacity: 1;
  transform: translateY(0) scale(1);
}

/* =========================================================
   CURSOS
   ========================================================= */
.cursos {
  padding: 90px 20px;
}
.cursos .carousel {
  max-width: 800px;
  width: 100%;
  z-index: 2;
}
.carousel-item {
  height: 700px;
  border-radius: 20px;
  overflow: hidden;
  background: var(--bg-pale);
}
.carousel-item.active,
.carousel-item-next,
.carousel-item-prev {
  display: flex;
  align-items: center;
  justify-content: center;
}
.carousel-item img {
  max-height: 100%;
  width: 100%;
  object-fit: contain;
}
.carousel-inner, .carousel {
  border-radius: 20px;
}
.carousel-caption h5 {
  background: rgba(28, 18, 64, 0.55);
  backdrop-filter: blur(6px);
  display: inline-block;
  padding: 4px 16px;
  border-radius: 100px;
  font-family: &quot;Poppins&quot;, sans-serif;
}
.carousel-indicators [data-bs-target] {
  background-color: var(--purple-600);
}

/* =========================================================
   PROYECTOS
   ========================================================= */
.proyectos {
  padding: 100px 20px 60px;
}
.proyectos img {
  height: 100%;
  width: 100%;
  padding: 0;
  border-radius: 18px;
  display: block;
  transition: transform 0.6s var(--ease-fluid);
}
.proyectos-contenedor {
  padding-top: 10px;
  margin-bottom: 40px;
  position: relative;
  z-index: 2;
}
.proyect {
  position: relative;
  height: 220px;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
  margin-bottom: 20px;
}
.overlay {
  transition: opacity 0.5s var(--ease-fluid);
  opacity: 0;
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 14px;
  background: linear-gradient(135deg, rgba(79, 52, 217, 0.92), rgba(63, 214, 224, 0.85));
  border-radius: 18px;
}
.overlay p {
  font-size: 1.05rem;
  font-weight: 700;
  color: #fff;
  margin-bottom: 0;
}
.proyect:hover img { transform: scale(1.08); }
.proyect:hover .overlay { opacity: 1; }

.proyectos ul {
  max-width: 900px;
  margin-top: 20px;
  padding: 0 10px 60px;
  list-style: none;
  position: relative;
  z-index: 2;
}
.proyectos ul li {
  position: relative;
  padding: 10px 0 10px 24px;
  color: var(--cyan-100);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.proyectos ul li::before {
  content: &quot;\203A&quot;;
  position: absolute;
  left: 0;
  color: var(--cyan-400);
  font-weight: 700;
}
.proyectos ul a {
  color: var(--cyan-200);
  font-weight: 600;
}

/* =========================================================
   EXPERIENCIAS — globos de tamaño uniforme
   ========================================================= */
.experiencias {
  color: var(--ink);
  padding: 90px 20px;
  background-color: var(--bg-pale);
}
.exp-row {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.rangoexp {
  margin-top: 24px;
  font-weight: 700;
  color: #fff;
  font-size: 0.9rem;
  width: 230px;
  text-align: center;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 8px 14px;
  border-radius: 100px;
  background: linear-gradient(90deg, var(--purple-600), var(--blue-500));
  transition: transform 0.4s var(--ease-fluid);
}
.exp-row:hover .rangoexp {
  transform: translateY(-3px) scale(1.03);
}
.experiencias span {
  color: var(--ink-soft);
  font-size: 1.05rem;
  margin-top: 6px;
  text-align: center;
}

/* =========================================================
   CONTACT
   ========================================================= */
.contact {
  padding: 100px 20px;
}
.contact .container {
  max-width: 1200px;
  min-height: 200px;
  padding: 20px;
  position: relative;
  z-index: 2;
}
.contact .rectangulo {
  background: linear-gradient(135deg, var(--purple-700), var(--purple-900));
  border-radius: 26px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
}
.contact .row {
  width: 100%;
  display: flex;
  align-items: center;
}
.contact .descripcion {
  color: var(--cyan-100);
  font-size: 1.2rem;
  padding: 30px;
  font-family: &quot;IBM Plex Sans&quot;, sans-serif;
  font-style: italic;
}
.contact button {
  color: white;
  font-weight: bold;
  background-color: transparent;
  border: 2px solid rgba(255, 255, 255, 0.5);
  padding: 1.25em 2em;
  margin: 10px;
  border-radius: 100px;
  transition: all 0.45s var(--ease-fluid);
}
.contact button i {
  color: white;
  font-size: 1.3rem;
  transition: all 0.45s var(--ease-fluid);
}
.contact button:hover {
  background: linear-gradient(90deg, var(--cyan-400), var(--blue-500));
  border-color: transparent;
  color: #0d0830;
  transform: translateY(-3px);
  box-shadow: 0 10px 24px rgba(63, 214, 224, 0.4);
}
.contact button:hover i {
  color: #0d0830;
}

/* =========================================================
   BUTTON-UP
   ========================================================= */
#button-up {
  width: 56px;
  height: 56px;
  background: linear-gradient(135deg, var(--purple-600), var(--blue-500));
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  border-radius: 50%;
  font-size: 20px;
  position: fixed;
  bottom: 40px;
  right: 40px;
  cursor: pointer;
  box-shadow: 0 10px 26px rgba(79, 52, 217, 0.4);
  border: 4px solid transparent;
  transition: all 0.5s var(--ease-fluid);
  transform: scale(0);
  z-index: 900;
}
#button-up:hover {
  transform: scale(1.1);
  border-color: rgba(0, 0, 0, 0.1);
}

/* =========================================================
   FOOTER
   ========================================================= */
footer {
  min-height: 300px;
  background-color: var(--purple-900);
  padding: 60px 20px 30px;
}
.footer-text {
  color: white;
  font-size: 1.4rem;
  padding: 20px;
  margin-bottom: 20px;
  font-family: &quot;Poppins&quot;, sans-serif;
  font-style: italic;
}
.icons-redes a {
  width: 46px;
  height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2px;
  margin: 10px;
  border: 2px solid white;
  border-radius: 50%;
  transition: all 0.45s var(--ease-fluid);
}
.icons-redes i {
  color: white;
  font-size: 1.3rem;
  transition: all 0.45s var(--ease-fluid);
}
.icons-redes a:hover {
  background: linear-gradient(135deg, var(--cyan-400), var(--purple-600));
  border-color: transparent;
  transform: translateY(-4px);
}
.icons-redes a:hover i {
  color: black;
}
.derechos-autor {
  font-size: 15px;
  color: #a99fd6;
  padding: 20px;
  margin-top: 20px;
}

/* =========================================================
   MEDIA QUERIES
   ========================================================= */
@media screen and (max-width: 767px) {
  .cursos .carousel .carousel-item {
    height: 320px;
  }
}
@media screen and (max-width: 767px) {
  .proyectos {
    padding: 90px 20px 40px;
  }
}
@media screen and (max-width: 767px) {
  header.hero {
    padding: 90px 20px 50px;
    min-height: auto;
  }
  .hero-eyebrow {
    margin-bottom: 16px;
  }
  .image-perfil {
    margin: 6px 0 18px;
  }
  .image-perfil img {
    width: 130px;
    height: 130px;
  }
}
@media screen and (max-width: 480px) {
  header.hero {
    padding-top: 78px;
  }
  .intro-wrap .sobre-mi {
    padding-top: 60px;
    padding-bottom: 100px;
  }
  .seccion-texto {
    font-size: 1rem;
  }
}

    <script>
// =========================================================
// scroll-up (comportamiento original)
// =========================================================
document.getElementById(&quot;button-up&quot;).addEventListener(&quot;click&quot;, scrollUp);

function scrollUp() {
  var CurrentScroll =
    document.documentElement.scrollTop || document.body.scrollTop;
  if (CurrentScroll > 0) {
    window.scrollTo(0, 0);
  }
}
buttonUp = document.getElementById(&quot;button-up&quot;);

window.onscroll = function () {
  var scroll = document.documentElement.scrollTop;

  if (scroll > 1800) {
    buttonUp.style.transform = &quot;scale(1)&quot;;
  } else if (scroll < 1800) {
    buttonUp.style.transform = &quot;scale(0)&quot;;
  }
};

// =========================================================
// title page (usa el idioma activo)
// =========================================================
const htmlEl = document.documentElement;
let previousTitle = document.title;

window.addEventListener(&quot;blur&quot;, () => {
  previousTitle = document.title;
  document.title = htmlEl.dataset[&quot;blur&quot; + capitalize(htmlEl.lang)];
});

window.addEventListener(&quot;focus&quot;, () => {
  document.title = previousTitle;
});

function capitalize(str) {
  return str.charAt(0).toUpperCase() + str.slice(1);
}

// =========================================================
// footer message effect (re-ejecutable al cambiar de idioma)
// =========================================================
const thanksEl = document.getElementById(&quot;thanks&quot;);
let typewriterTimeoutId = null;

function startTypewriter(str) {
  clearTimeout(typewriterTimeoutId);
  thanksEl.innerHTML = &quot;&quot;;
  let i = 0;
  const speed = 60;

  function typeWriter() {
    if (i < str.length) {
      thanksEl.innerHTML += str.charAt(i);
      i++;
      typewriterTimeoutId = setTimeout(typeWriter, speed);
    }
  }
  typewriterTimeoutId = setTimeout(typeWriter, speed);
}

// =========================================================
// NAVBAR: efecto vidrio al hacer scroll
// =========================================================
const mainNav = document.getElementById(&quot;mainNav&quot;);
const langSwitch = document.getElementById(&quot;langSwitch&quot;);

function toggleNavGlass() {
  const isScrolled = window.scrollY > 80;
  mainNav.classList.toggle(&quot;scrolled&quot;, isScrolled);
  if (langSwitch) langSwitch.classList.toggle(&quot;scrolled&quot;, isScrolled);
}
toggleNavGlass();
window.addEventListener(&quot;scroll&quot;, toggleNavGlass);

// =========================================================
// NAVBAR: resaltar el link de la sección activa
// =========================================================
const navLinks = document.querySelectorAll(&quot;.nav-link&quot;);
const spySections = document.querySelectorAll(&quot;main section[id], #about-me&quot;);

const navSpy = new IntersectionObserver(
  (entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        const id = entry.target.getAttribute(&quot;id&quot;);
        navLinks.forEach((link) => link.classList.remove(&quot;active&quot;));
        const activeLink = document.querySelector(
          '.nav-link[href=&quot;#' + id + '&quot;]'
        );
        if (activeLink) activeLink.classList.add(&quot;active&quot;);
      }
    });
  },
  { rootMargin: &quot;-40% 0px -55% 0px&quot; }
);
spySections.forEach((section) => navSpy.observe(section));

// cerrar el menú colapsable (mobile) al elegir una sección
const navbarCollapseEl = document.getElementById(&quot;navbar-toggler&quot;);
const navbarTogglerBtn = document.querySelector(&quot;.navbar-toggler&quot;);

if (navbarCollapseEl && window.bootstrap) {
  const bsCollapse = window.bootstrap.Collapse.getOrCreateInstance(
    navbarCollapseEl,
    { toggle: false }
  );
  navLinks.forEach((link) => {
    link.addEventListener(&quot;click&quot;, () => {
      if (navbarCollapseEl.classList.contains(&quot;show&quot;)) {
        bsCollapse.hide();
      }
    });
  });

  // icono hamburguesa -> X, con transición suave
  navbarCollapseEl.addEventListener(&quot;show.bs.collapse&quot;, () => {
    navbarTogglerBtn.classList.add(&quot;is-open&quot;);
  });
  navbarCollapseEl.addEventListener(&quot;hide.bs.collapse&quot;, () => {
    navbarTogglerBtn.classList.remove(&quot;is-open&quot;);
  });
}

// =========================================================
// Revelado progresivo al hacer scroll (data-reveal)
// =========================================================
const revealEls = document.querySelectorAll(&quot;[data-reveal]&quot;);

const revealObserver = new IntersectionObserver(
  (entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add(&quot;in-view&quot;);
        revealObserver.unobserve(entry.target);
      }
    });
  },
  { threshold: 0.15 }
);

revealEls.forEach((el) => revealObserver.observe(el));

// =========================================================
// SELECTOR DE IDIOMA (ES / EN)
// =========================================================
const textNodes = document.querySelectorAll(&quot;[data-i18n]&quot;);
const htmlNodes = document.querySelectorAll(&quot;[data-i18n-html]&quot;);
const langButtons = document.querySelectorAll(&quot;.lang-btn&quot;);

function applyLanguage(lang) {
  htmlEl.lang = lang;

  textNodes.forEach((el) => {
    if (el.dataset[lang] !== undefined) el.textContent = el.dataset[lang];
  });

  htmlNodes.forEach((el) => {
    const key = lang + &quot;Html&quot;;
    if (el.dataset[key] !== undefined) el.innerHTML = el.dataset[key];
  });

  document.title = htmlEl.dataset[&quot;title&quot; + capitalize(lang)];
  previousTitle = document.title;

  startTypewriter(thanksEl.dataset[lang]);

  langButtons.forEach((btn) => {
    btn.classList.toggle(&quot;active&quot;, btn.dataset.lang === lang);
  });

  try {
    localStorage.setItem(&quot;siteLang&quot;, lang);
  } catch (e) {
    /* localStorage no disponible: el idioma simplemente no persiste */
  }
}

langButtons.forEach((btn) => {
  btn.addEventListener(&quot;click&quot;, () => {
    if (!btn.classList.contains(&quot;active&quot;)) applyLanguage(btn.dataset.lang);
  });
});

let savedLang = &quot;es&quot;;
try {
  savedLang = localStorage.getItem(&quot;siteLang&quot;) || &quot;es&quot;;
} catch (e) {
  savedLang = &quot;es&quot;;
}
applyLanguage(savedLang);

</script>
